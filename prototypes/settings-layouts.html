          ${COLORS.map(c => `
            <button class="swatch btn-press" data-act="color" data-color="${c.id}" aria-pressed="false"
                    aria-label="${c.id}" style="background:${c.hex};color:${c.hex}"></button>`).join('')}
        </div>
      </div>
    </div>`,

  text: () => `
    <div class="sec">
      <div class="field">
        <div class="field-head">
          <span class="sublabel">Title</span>
          <span class="count" data-bind="titleCount"></span>
        </div>
        <input class="input" data-bind="titleInput" data-act="title" maxlength="40" value="${esc(state.titleText)}">
      </div>
      <div class="field">
        <div class="field-head">
          <span class="sublabel">Message</span>
          <span class="count" data-bind="msgCount"></span>
        </div>
        <textarea class="textarea" data-bind="msgInput" data-act="msg" maxlength="60">${esc(state.messageText)}</textarea>
      </div>
    </div>`,

  time: () => `
    <div class="sec">
      <div class="clockwrap">
        <input class="clock" data-bind="clock" inputmode="numeric" maxlength="5" value="${clockInput}" aria-label="Interval">
        <div class="clock-mirror" aria-hidden="true" data-bind="clockMirror"></div>
      </div>
      <div class="every">
        <span class="every-label">Every:</span>
        <span class="every-value" data-bind="every"></span>
      </div>
    </div>`,

  icon: () => `
    <div class="sec">
      <div style="display:flex;align-items:center;gap:var(--gap)">
        <div class="iconbox"><img data-bind="iconPreview" alt=""></div>
        <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-width:0">
          <button class="linkbtn" data-act="upload">Upload Custom</button>
          <button class="linkbtn" data-act="resetIcon" data-bind="resetIcon" hidden>Use default</button>
          <div class="checkrow" data-act="showLogo" role="checkbox" aria-checked="true" tabindex="0">
            <span class="checkbox" data-bind="check"></span>
            <span class="checklabel">Show Logo</span>
          </div>
        </div>
      </div>
    </div>`,

  appearance: () => `
    <div class="sec">
      <div class="theme-row">
        ${['system','light','dark'].map(t => `
          <button class="theme-btn" data-act="theme" data-theme="${t}" aria-pressed="false">
            ${themeIcon(t)}<span>${t[0].toUpperCase() + t.slice(1)}</span>
          </button>`).join('')}
      </div>
    </div>`,

  // Variant 6 only. Included because it is the setting that decides the
  // stage-on-the-right question: with the toast pinned top-right of a stage
  // that stands in for the screen, the layout mirrors reality. Each button is
  // a mini screen with the toast's slot marked, so the picker teaches what the
  // stage is without needing a caption on the stage itself.
  position: () => `
    <div class="sec">
      <div class="pos-grid">
        ${POSITIONS.map(p => `
          <button class="pos-btn" data-act="pos" data-pos="${p}" aria-pressed="false"
                  aria-label="${p.replace('-', ' ')}" title="${p.replace('-', ' ')}"><i></i></button>`).join('')}
      </div>
    </div>`,
}

/* ═══════════════════════════════════════════════════════════════════════════
   SHARED CHROME FRAGMENTS
   ═════════════════════════════════════════════════════════════════════════ */
function brandHTML() {
  return `<div class="brand">
    <img data-bind="brandIcon" alt="Sip">
    <span class="wordmark">Sip Hydra</span>
  </div>`
}
function navLinksHTML() {
  return `<div class="navlinks">
    <a class="navlink" href="#" onclick="return false">Info</a>
    <a class="navlink" href="#" onclick="return false">Download</a>
  </div>`
}
// opts.logo === false omits the logo beside the title. Variant 7 uses it: the
// new design removes the Icon card, and with it `showLogo` / `customIcon`, so
// the toast has nothing to put there.
function toastHTML(opts = {}) {
  return `<div class="toast">
    <div class="toast-row">
      <div class="toast-left">
        <div class="toast-bottle">
          <img class="sip-bottle-shimmer" data-bind="toastBottle" alt="">
          <div class="sip-bottle-shimmer-overlay" data-bind="toastShimmer"></div>
        </div>
        <div class="toast-body">
          <div class="toast-head">
            <div class="toast-titlerow">
              <span class="toast-title" data-nofit data-bind="toastTitle"></span>
              ${opts.logo === false ? '' : '<span class="toast-logo" data-bind="toastLogo"><img data-bind="toastLogoImg" alt=""></span>'}
            </div>
            <p class="toast-msg" data-bind="toastMsg"></p>
          </div>
          <span class="toast-cta">Edit preferences</span>
        </div>
      </div>
      <span class="toast-x">${ICON.x}</span>
    </div>
  </div>`
}
function previewCardHTML() {
  return `<div class="card preview-card">
    ${toastHTML()}
    <button class="pill btn-press" data-act="test">Test</button>
  </div>`
}
function tabsHTML(cls, opts = {}) {
  return SECTIONS.map(s => `
    <button data-act="section" data-section="${s.id}" aria-selected="${activeSection === s.id}"
            role="tab" title="${s.label}">
      ${opts.icons === false ? '' : ICON[s.id]}${opts.labels === false ? '' : `<span class="lbl">${s.label}</span>`}
    </button>`).join('')
}
function panelHTML() {
  const s = SECTIONS.find(x => x.id === activeSection)
  return `<div class="panel panel-anim" key="${activeSection}">
    <div class="panel-head">
      <span class="card-title">${s.label}</span>
    </div>
    ${CONTENT[activeSection]()}
  </div>`
}

/* ═══════════════════════════════════════════════════════════════════════════
   VARIANTS
   ═════════════════════════════════════════════════════════════════════════ */
const VARIANTS = {
  /* 1 — Segmented ---------------------------------------------------------- */
  1: () => `
    <div class="v1">
      <div class="nav nav-center">
        <div class="cluster">
          ${brandHTML()}
          <span class="divider"></span>
          ${navLinksHTML()}
        </div>
      </div>
      <div class="v1-col">
        ${previewCardHTML()}
        <div class="segbar" role="tablist">${tabsHTML()}</div>
        <div class="card panel-card">${panelHTML()}</div>
      </div>
    </div>`,

  /* 2 — Rail / Tab bar ----------------------------------------------------- */
  2: () => `
    <div class="v2">
      <div class="topbar">${brandHTML()}${navLinksHTML()}</div>
      <div class="v2-body">
        <aside class="rail" role="tablist">
          <div class="rail-top">${brandHTML()}</div>
          ${tabsHTML()}
          <div class="rail-foot">${navLinksHTML()}</div>
        </aside>
        <main class="v2-main">
          ${previewCardHTML()}
          <div class="card panel-card">${panelHTML()}</div>
        </main>
      </div>
      <nav class="tabbar" role="tablist">${tabsHTML()}</nav>
    </div>`,

  /* 3 — Inspector split ---------------------------------------------------- */
  3: () => `
    <div class="v3">
      <div class="nav">${brandHTML()}${navLinksHTML()}</div>
      <div class="v3-body">
        <section class="v3-canvas">
          <div class="canvas-toast">${toastHTML()}</div>
          <div class="canvas-foot">
            <span class="canvas-note">This area stands in for the screen — the reminder lands in the top-right corner.</span>
            <button class="pill btn-press" data-act="test">Test</button>
          </div>
        </section>
        <section class="card v3-inspector">
          <div class="v3-tabs" role="tablist">${tabsHTML(null, { labels: false })}</div>
          ${panelHTML()}
        </section>
      </div>
    </div>`,

  /* 4 — Control dock ------------------------------------------------------- */
  4: () => `
    <div class="v4">
      <div class="nav">${brandHTML()}${navLinksHTML()}</div>
      <div class="v4-stage">
        ${toastHTML()}
        <button class="pill btn-press" data-act="test">Test</button>
      </div>
      <div class="v4-sheet" ${sheetOpen ? '' : 'hidden'}>
        <div class="card">${panelHTML()}</div>
      </div>
      <div class="dock-wrap">
        <nav class="dock" role="tablist">
          ${SECTIONS.map(s => `
            <button data-act="dock" data-section="${s.id}" role="tab"
                    aria-selected="${sheetOpen && activeSection === s.id}" title="${s.label}">
              ${ICON[s.id]}<span class="lbl">${s.label}</span>
            </button>`).join('')}
        </nav>
      </div>
    </div>`,

  /* 5 — Adaptive ----------------------------------------------------------- */
  5: () => {
    const roomy = v5Roomy()
    if (roomy) {
      // Enough room for everything at once — a *fitted* bento, still no scroll.
      return `
      <div class="v5">
        <div class="nav">${brandHTML()}${navLinksHTML()}</div>
        <div class="v5-body">
          <div class="v5-left">
            ${previewCardHTML()}
            <div class="card" style="flex:0 1 auto;min-height:0;padding:var(--cardpad);display:flex;flex-direction:column;gap:var(--gap)">
              <span class="card-title" style="padding-left:4px">Text</span>
              ${CONTENT.text()}
            </div>
          </div>
          <div class="v5-grid">
            <div class="card cell-bottle">
              <span class="card-title" style="padding:0 4px 10px">Bottle</span>
              ${CONTENT.bottle()}
            </div>
            <div class="card cell-time">
              <span class="card-title" style="padding:0 4px 10px">Time</span>
              ${CONTENT.time()}
            </div>
            <div class="card cell-icon">

// Variant 5's own decision rule. Deliberately a real measurement of the
// container, not a width breakpoint: "all five at once" needs BOTH axes.
function v5Roomy() {
  const r = stage.getBoundingClientRect()
  return r.width >= 1000 && r.height >= 720
}

/* ═══════════════════════════════════════════════════════════════════════════
   RENDER + SYNC
   render() rebuilds the variant chrome. sync() pushes state into the DOM
   without re-rendering, so typing never loses focus or caret position.
   ═════════════════════════════════════════════════════════════════════════ */
const app = $('#app')
const stage = $('#stage')

// Set by render() when variant 6's scrolling column exists; re-run on resize
// so the "more below" cue tracks a viewport change, not just a scroll.
let syncScrollHint = () => {}

function render() {
  app.innerHTML = VARIANTS[variant]()

  const panel = app.querySelector('.v6-panel, .v7-scroller')
  if (panel) {
    const col = panel.closest('.v6-controls, .v7-controls')
    syncScrollHint = () => {
      const more = panel.scrollHeight - panel.clientHeight - panel.scrollTop > 4
      col.dataset.more = more ? '1' : '0'
    }
    panel.addEventListener('scroll', syncScrollHint, { passive: true })
  } else {
    syncScrollHint = () => {}
  }

  sync()
  syncScrollHint()
  measureFit()
}

function sync() {
  const dark = isDark()

  $$('[data-bind="brandIcon"]', app).forEach(el => el.src = iconUrl(dark))

  // bottle
  const url = bottleUrl(state.bottleType, state.bottleColor)
  $$('[data-bind="hero"]', app).forEach(el => el.src = url)
  $$('[data-bind="thumb"]', app).forEach(el => el.src = bottleUrl(el.dataset.type, state.bottleColor))
  $$('[data-act="type"]', app).forEach(el => el.setAttribute('aria-pressed', String(el.dataset.type === state.bottleType)))
  $$('[data-act="color"]', app).forEach(el => el.setAttribute('aria-pressed', String(el.dataset.color === state.bottleColor)))

  // text
  // Variant 7 abbreviates to "Chars" — at 15px the full word no longer fits
  // beside the label in a 290px column.
  const unit = variant === 7 ? 'Chars' : 'Characters'
  $$('[data-bind="titleCount"]', app).forEach(el => {
    el.textContent = `${state.titleText.length}/40 ${unit}`
    el.dataset.over = state.titleText.length >= 35 ? '1' : '0'
  })
  $$('[data-bind="msgCount"]', app).forEach(el => {
    el.textContent = `${state.messageText.length}/60 ${unit}`
    el.dataset.over = state.messageText.length >= 55 ? '1' : '0'
  })
  // Keep duplicate inputs (variant 5's roomy mode) in step without stealing
  // the caret from the one being typed in.
  $$('[data-bind="titleInput"]', app).forEach(el => { if (el !== document.activeElement) el.value = state.titleText })
  $$('[data-bind="msgInput"]', app).forEach(el => { if (el !== document.activeElement) el.value = state.messageText })

  // time
  $$('[data-bind="clock"]', app).forEach(el => { if (el !== document.activeElement) el.value = clockInput })
  $$('[data-bind="clockMirror"]', app).forEach(el => {
    el.innerHTML = `${clockInput.slice(0,2)}<span class="colon">:</span>${clockInput.slice(3)}`
  })
  $$('[data-bind="every"]', app).forEach(el => el.textContent = intervalWords(state.intervalMinutes))

  // icon
  $$('[data-bind="iconPreview"]', app).forEach(el => el.src = state.customIcon || iconUrl(dark))
  $$('[data-bind="resetIcon"]', app).forEach(el => el.hidden = !state.customIcon)
  $$('[data-bind="check"]', app).forEach(el => el.innerHTML = state.showLogo ? ICON.check : '')
  $$('[data-act="showLogo"]', app).forEach(el => el.setAttribute('aria-checked', String(state.showLogo)))

  // position (variant 6)
  $$('[data-bind="stage"]', app).forEach(el => el.dataset.pos = toastPosition)
  $$('[data-act="pos"]', app).forEach(el => el.setAttribute('aria-pressed', String(el.dataset.pos === toastPosition)))

  // appearance
  $$('[data-act="theme"]', app).forEach(el => el.setAttribute('aria-pressed', String(el.dataset.theme === state.theme)))
  $$('.w-btn[data-wtheme]').forEach(el => el.setAttribute('aria-pressed', String(el.dataset.wtheme === state.theme)))

  // toast (preview + any live ones)
  syncToast(app)
  $$('#toasts .toast').forEach(t => syncToast(t))
}

// CSS mask-image is fetched under CORS rules even for same-directory assets,
// and file:// has a null origin — so the shimmer mask is unfetchable when the
// prototype is opened by double-clicking it. Left unguarded it paints an
// unmasked white rectangle over the bottle and floods the console. The hue
// rotation on the image itself is unaffected and still runs.
const CAN_MASK = location.protocol !== 'file:'

function syncToast(root) {
  const dark = isDark()
  const url = bottleUrl(state.bottleType, state.bottleColor)
  $$('[data-bind="toastBottle"]', root).forEach(el => el.src = url)
  $$('[data-bind="toastShimmer"]', root).forEach(el => {
    if (!CAN_MASK) { el.style.display = 'none'; return }
    el.style.maskImage = `url(${url})`
    el.style.webkitMaskImage = `url(${url})`
  })
  $$('[data-bind="toastTitle"]', root).forEach(el => el.textContent = state.titleText || 'Title')
  $$('[data-bind="toastMsg"]', root).forEach(el => el.textContent = state.messageText || 'Message')
  $$('[data-bind="toastLogo"]', root).forEach(el => el.style.display = state.showLogo ? 'flex' : 'none')
  $$('[data-bind="toastLogoImg"]', root).forEach(el => el.src = state.customIcon || iconUrl(dark))
}

// Re-render only the panel — used when switching section, so the preview card
// and its images are never rebuilt (no image flash).
// Replaces the .panel node itself rather than rewriting its parent: in the
// inspector variant the parent also holds the tab strip, which rewriting the
// parent would destroy mid-click.
function renderPanel() {
  const panels = $$('.panel', app)
  if (!panels.length) return render()
  panels.forEach(p => {
    const tmp = document.createElement('div')
    tmp.innerHTML = panelHTML()
    p.replaceWith(tmp.firstElementChild)
  })
  $$('[data-act="section"], [data-act="dock"]', app).forEach(el => {
    el.setAttribute('aria-selected', String(el.dataset.section === activeSection && (variant !== 4 || sheetOpen)))
  })
  sync()
  measureFit()
}

/* ═══════════════════════════════════════════════════════════════════════════
   INTERACTION
   ═════════════════════════════════════════════════════════════════════════ */
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]')
  if (!el) return
  const act = el.dataset.act

  if (act === 'type')  { state.bottleType = el.dataset.type; sync(); save() }
  if (act === 'color') { state.bottleColor = el.dataset.color; sync(); save() }
  if (act === 'theme') { setTheme(el.dataset.theme) }
  if (act === 'showLogo') { state.showLogo = !state.showLogo; sync(); save() }
  if (act === 'upload') pickIcon()
  if (act === 'resetIcon') { state.customIcon = null; sync(); save() }
  if (act === 'test') testToast()
  if (act === 'modal') { modalOpen = true; render(); return }
  if (act === 'modal-close') {
    // Scrim and × share this action; ignore clicks that landed inside the card.
    if (el.classList.contains('v7-scrim') && e.target.closest('[data-modal]')) return
    modalOpen = false; render(); return
  }
  if (act === 'pos') { toastPosition = el.dataset.pos; sync(); replayToast(); save() }
  if (act === 'replay') replayToast({ full: true })

  if (act === 'section') {
    if (activeSection === el.dataset.section) return
    activeSection = el.dataset.section
    renderPanel(); save()
  }
  if (act === 'dock') {
    // Tapping the active dock item closes the sheet — the zero-chrome state.
    if (sheetOpen && activeSection === el.dataset.section) { sheetOpen = false; render(); return }
    const changed = activeSection !== el.dataset.section
    activeSection = el.dataset.section
    if (!sheetOpen) { sheetOpen = true; render() }
    else if (changed) renderPanel()
    save()
  }
})

app.addEventListener('keydown', e => {
  if (e.target.matches('[data-act="showLogo"]') && (e.key === ' ' || e.key === 'Enter')) {
    e.preventDefault(); state.showLogo = !state.showLogo; sync(); save()
  }
})

app.addEventListener('input', e => {
  const el = e.target
  if (el.dataset.act === 'title') { state.titleText = el.value; sync(); save() }
  if (el.dataset.act === 'msg')   { state.messageText = el.value; sync(); save() }
  // Clock fallback for non-keyboard input (paste, autofill, IME). Keyboard
  // edits are handled in the keydown mask, which preventDefaults and so never
  // reaches here.
  if (el.dataset.bind === 'clock') {
    const digits = el.value.replace(/\D/g, '').slice(0, 4).padEnd(4, '0')
    commitClock(el, `${digits.slice(0,2)}:${digits.slice(2)}`, 5)
  }
})

/* ── clock mask ───────────────────────────────────────────────────────────
   Fixed 5-char "HH:MM": the colon lives at index 2 permanently and every
   digit slot always holds a character, so the field can never reflow and the
   caret hops over the colon. Condensed port of Settings.tsx's handler.      */
app.addEventListener('keydown', e => {
  const el = e.target
  if (!el.matches('[data-bind="clock"]')) return
  if (e.key === 'Enter') { el.blur(); return }
  if (e.metaKey || e.ctrlKey || e.altKey) return

  const start = el.selectionStart ?? 0
  const end   = el.selectionEnd ?? start
  const chars = clockInput.split('')
  const clearSel = () => { for (let i = start; i < end; i++) if (i !== 2) chars[i] = '0' }

  if (/^[0-9]$/.test(e.key)) {
    e.preventDefault()
    if (start !== end) clearSel()
    let pos = start === 2 ? 3 : start
    if (pos > 4) return
    chars[pos] = e.key
    let caret = pos + 1
    if (caret === 2) caret = 3
    commitClock(el, chars.join(''), caret)
    return
  }
  if (e.key === 'Backspace') {
    e.preventDefault()
    if (start !== end) { clearSel(); commitClock(el, chars.join(''), start); return }
    let t = start - 1
    if (t === 2) t = 1
    if (t < 0) return
    chars[t] = '0'
    commitClock(el, chars.join(''), t)
    return
  }
  if (e.key === 'Delete') {
    e.preventDefault()
    if (start !== end) { clearSel(); commitClock(el, chars.join(''), start === 2 ? 3 : start); return }
    const t = start === 2 ? 3 : start
    if (t > 4) return
    chars[t] = '0'
    commitClock(el, chars.join(''), t)
  }
})
function commitClock(el, next, caret) {
  clockInput = next
  el.value = next
  el.setSelectionRange(caret, caret)
  const mins = parseClock(next)
  if (mins !== null) state.intervalMinutes = mins
  sync(); save()
}
app.addEventListener('blur', e => {
  if (!e.target.matches?.('[data-bind="clock"]')) return
  const mins = parseClock(clockInput)
  if (mins === null) {
    const h = String(Math.floor(state.intervalMinutes / 60)).padStart(2, '0')
    const m = String(state.intervalMinutes % 60).padStart(2, '0')
    clockInput = `${h}:${m}`
  }
  sync()
}, true)

function pickIcon() {
  const inp = document.createElement('input')
  inp.type = 'file'; inp.accept = 'image/*'
  inp.onchange = () => {
    const f = inp.files?.[0]; if (!f) return
    const r = new FileReader()
    r.onload = () => { state.customIcon = r.result; sync(); save() }
    r.readAsDataURL(f)
  }
  inp.click()
}

// Variant 6's Test. There is no second toast to spawn — the stage's toast IS
// the real thing at the real position, so Test replays its lifecycle in place.
//
// WHY THERE IS AN EXIT AT ALL. Playing only the entrance felt abrupt, and the
// abrupt part was not the entrance: `animation: <enter> both` puts the toast at
// its from-state on frame 0, so the toast TELEPORTED off-stage and then slid
// back. The hard cut was the departure. Adding a delay in front of the entrance
// does not fix that — with fill-mode `both` the toast still vanishes instantly
// and then you wait, which isolates the cut instead of removing it. So the exit
// is animated too, and the delay becomes a HOLD between the two halves:
//
//   exit (200ms, shipped)  →  hold (tunable)  →  enter (400ms, shipped)
//
// which is a real notification lifecycle: dismissed, gone for a beat, arrives.
// ~820ms total is well past the <300ms rule for UI response, and that is fine —
// this is a rarely-pressed playback, not a UI reaction. The 200ms exit is
// immediate feedback that the click landed.
//
// Removing the class and forcing a reflow before re-adding is what makes the
// animation restartable; without the offsetWidth read the removal and addition
// coalesce into one style update and nothing replays.
let holdMs = 220
let replaySeq = 0

function replayToast(opts = {}) {
  const t = app.querySelector('.v6-stage .toast, .v7-preview .toast')
  if (!t) return
  const seq = ++replaySeq          // invalidates any sequence still in flight
  t.classList.remove('leaving', 'replay')
  void t.offsetWidth

  // Position changes get the entrance only. Running the full exit→hold→enter
  // on every swatch click would make clicking through the six positions feel
  // like wading; the toast has already visibly moved, so all it needs is to
  // land again.
  if (!opts.full) { t.classList.add('replay'); return }

  t.classList.add('leaving')
  const exitMs = parseFloat(getComputedStyle(document.documentElement)
    .getPropertyValue('--sip-exit-duration')) || 200
  setTimeout(() => {
    if (seq !== replaySeq || !t.isConnected) return
    // Both class changes land in one task, so the settled state between them
    // is never painted — no flash at the resting position mid-sequence.
    t.classList.remove('leaving')
    void t.offsetWidth
    t.classList.add('replay')
  }, exitMs + holdMs)
}

const toastLayer = $('#toasts')
function testToast() {
  if (toastLayer.children.length >= 3) toastLayer.firstElementChild.remove()
  const wrap = document.createElement('div')
  wrap.innerHTML = toastHTML()
  const t = wrap.firstElementChild
  syncToast(t)
  t.querySelector('.toast-x').style.cursor = 'pointer'
  t.querySelector('.toast-x').onclick = () => dismiss(t)
  toastLayer.appendChild(t)
  const timer = setTimeout(() => dismiss(t), 5000)
  function dismiss(node) {
    clearTimeout(timer)
    node.classList.add('out')
    node.addEventListener('animationend', () => node.remove(), { once: true })
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   FIT MEASUREMENT — the scoreboard for the thesis.
   Walks the rendered tree for any element whose content is taller/wider than
   its box. Because .app is a fixed-height, overflow-clipped flex tree, that is
   exactly the condition the bento layout used to resolve by scrolling.
   ═════════════════════════════════════════════════════════════════════════ */
// Debounced past the 240ms panel/sheet entry animation. A transformed
// descendant contributes to its ancestors' scrollable overflow area, so the
// panel's translateY(4px) entry reads as a real 4px overflow if you measure
// while it is still running — which is how this meter reported CLIPPED on
// layouts that fit perfectly.
let fitTimer
function measureFit() {
  clearTimeout(fitTimer)
  fitTimer = setTimeout(() => {
    let worst = 0, worstEl = null, intentional = 0
    const all = app.querySelectorAll('*')
    for (const el of all) {
      // Form controls scroll their own value by design, and the toast title is
      // deliberately ellipsised — neither is the layout failing to fit.
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') continue
      // closest(), not hasAttribute(): data-nofit marks a SUBTREE whose overflow
      // is deliberate. The clock's colon is the case that forced this — the
      // nudge is a transform on a blockified flex item, so the span itself
      // reports the overflow, not just its parent.
      if (el.closest('[data-nofit]')) continue
      // Variant 6 scrolls its control column on purpose. Counted and reported
      // rather than silently ignored — the badge's job is to prove the STAGE
      // never clips, and it would be dishonest to let a designed scroll region
      // read the same as a layout that fits in one screen.
      if (el.hasAttribute('data-scroll-ok')) {
        if (el.scrollHeight - el.clientHeight > 1) intentional++
        continue
      }
      const dy = el.scrollHeight - el.clientHeight
      const dx = el.scrollWidth  - el.clientWidth
      const d = Math.max(dy, dx)
      if (d > worst) { worst = d; worstEl = el }
    }
    const ok = worst <= 1
    const fit = $('#w-fit')
    fit.dataset.ok = ok ? '1' : '0'
    $('#w-fit-hd').textContent = ok ? 'FITS' : 'CLIPPED'
    const r = stage.getBoundingClientRect()
    const dims = `${Math.round(r.width)}×${Math.round(r.height)}`
    $('#w-fit-sub').textContent = ok
      ? `${dims} · ${intentional ? `${intentional} scroll region (by design)` : 'nothing clipped'}`
      : `${dims} · ${Math.round(worst)}px over in .${(worstEl?.className || '?').toString().trim().split(/\s+/)[0] || 'node'}`
  }, 300)
}

/* ═══════════════════════════════════════════════════════════════════════════
   DEVICE FRAMES
   ═════════════════════════════════════════════════════════════════════════ */
const FRAMES = [
  { id: 'fill',    label: 'Fill window' },
  { id: '320x568', label: 'iPhone SE (320×568)',      w: 320,  h: 568 },
  { id: '390x844', label: 'iPhone 14 (390×844)',      w: 390,  h: 844 },
  { id: '430x932', label: 'iPhone Pro Max (430×932)', w: 430,  h: 932 },
  { id: '744x1133',label: 'iPad mini (744×1133)',     w: 744,  h: 1133 },
  { id: '820x1180',label: 'iPad Air (820×1180)',      w: 820,  h: 1180 },
  { id: '1024x768',label: 'iPad landscape (1024×768)',w: 1024, h: 768 },
  { id: '1280x720',label: 'Short laptop (1280×720)',  w: 1280, h: 720 },
  { id: '1440x900',label: 'Laptop (1440×900)',        w: 1440, h: 900 },
  { id: '1920x1080',label:'Desktop (1920×1080)',      w: 1920, h: 1080 },
  { id: '400x600', label: 'Extension popup-ish (400×600)', w: 400, h: 600 },
]
let frameId = 'fill'
const frameEl = $('#frame')

function applyFrame() {
  const f = FRAMES.find(x => x.id === frameId) || FRAMES[0]
  if (!f.w) {
    frameEl.dataset.mode = 'fill'
    stage.style.width = stage.style.height = ''
    stage.style.transform = ''
  } else {
    frameEl.dataset.mode = 'preset'
    const availW = window.innerWidth  - 56
    const availH = window.innerHeight - 56
    const scale = Math.min(1, availW / f.w, availH / f.h)
    stage.style.width  = f.w + 'px'
    stage.style.height = f.h + 'px'
    // Visual scale only — layout still happens at the device's real px, so
    // container queries and cqh units stay truthful.
    stage.style.transform = scale < 1 ? `scale(${scale})` : ''
  }
  measureFit()
}

/* ═══════════════════════════════════════════════════════════════════════════
   WIDGET
   ═════════════════════════════════════════════════════════════════════════ */
const VARIANT_META = [
  { n: 1, name: 'Segmented',       note: 'preview + centred tabs' },
  { n: 2, name: 'Rail / Tab bar',  note: 'rail ⇄ bottom bar' },
  { n: 3, name: 'Inspector split', note: 'canvas + docked panel' },
  { n: 4, name: 'Control dock',    note: 'hero preview, summoned sheet' },
  { n: 5, name: 'Adaptive',        note: 'all-at-once ⇄ tabs' },
  { n: 6, name: 'Editor',          note: 'controls left, stage right' },
  { n: 7, name: 'The design',      note: 'Paper export + dark mode + modal' },
]
const widget = $('#widget')

$('#w-variants').innerHTML = VARIANT_META.map(v => `
  <button class="w-btn" data-wvariant="${v.n}" aria-pressed="false" title="${v.note}">
    <span class="k">${v.n}</span><span>${v.name}</span>
  </button>`).join('')

$('#w-frame').innerHTML = FRAMES.map(f => `<option value="${f.id}">${f.label}</option>`).join('')

$('#w-themes').innerHTML = ['system','light','dark'].map(t => `
  <button class="w-btn" data-wtheme="${t}" aria-pressed="false">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')

$('#w-variants').addEventListener('click', e => {
  const b = e.target.closest('[data-wvariant]'); if (!b) return
  setVariant(+b.dataset.wvariant)
})
$('#w-themes').addEventListener('click', e => {
  const b = e.target.closest('[data-wtheme]'); if (!b) return
  setTheme(b.dataset.wtheme)
})
$('#w-frame').addEventListener('change', e => { frameId = e.target.value; applyFrame(); render(); save() })
$('#w-collapse').addEventListener('click', () => { widget.classList.toggle('collapsed'); save() })
$('#w-hide').addEventListener('click', () => hideWidget(true))
$('#w-show').addEventListener('click', () => hideWidget(false))

function hideWidget(hide) {
  widget.classList.toggle('hidden', hide)
  $('#w-show').classList.toggle('on', hide)
  save()
}
$('#w-test').addEventListener('click', () => { showTest = !showTest; syncWidget(); render(); save() })

// 0 is the "before" case for comparison — exit straight into enter, no beat.
const HOLDS = [0, 150, 220, 320]
$('#w-hold').innerHTML = HOLDS.map(h =>
  `<button class="w-btn" data-whold="${h}" aria-pressed="false">${h || 'none'}</button>`).join('')
$('#w-hold').addEventListener('click', e => {
  const b = e.target.closest('[data-whold]'); if (!b) return
  holdMs = +b.dataset.whold
  syncWidget(); save()
  replayToast({ full: true })   // play it immediately so the value is audible, so to speak
})

// The Test-button toggle only means anything in variant 6, so it only appears
// there — the widget should not offer a control that does nothing.
function syncWidget() {
  $$('[data-wvariant]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.wvariant === variant)))
  $('#w-v6opts').hidden = variant !== 6
  $('#w-test').setAttribute('aria-pressed', String(showTest))
  $$('[data-whold]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.whold === holdMs)))
}

function setVariant(n) {
  variant = n
  modalOpen = false
  if (n === 4) sheetOpen = true
  syncWidget()
  render(); save()
}

/* ── drag ─────────────────────────────────────────────────────────────────
   Pointer events (not mouse) so it works with trackpad, touch and pen alike.
   Position is clamped into the viewport on drop AND on resize, so the widget
   can never end up parked off-screen with no way back.                      */
let drag = null
$('#w-head').addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return
  const r = widget.getBoundingClientRect()
  drag = { dx: e.clientX - r.left, dy: e.clientY - r.top }
  widget.classList.add('dragging')
  $('#w-head').setPointerCapture(e.pointerId)
  e.preventDefault()
})
$('#w-head').addEventListener('pointermove', e => {
  if (!drag) return
  placeWidget(e.clientX - drag.dx, e.clientY - drag.dy)
})
$('#w-head').addEventListener('pointerup', e => {
  if (!drag) return
  drag = null
  widget.classList.remove('dragging')
  $('#w-head').releasePointerCapture(e.pointerId)
  save()
})
function placeWidget(x, y) {
  const r = widget.getBoundingClientRect()
  const maxX = window.innerWidth  - r.width  - 8
  const maxY = window.innerHeight - r.height - 8
  const nx = Math.max(8, Math.min(x, Math.max(8, maxX)))
  const ny = Math.max(8, Math.min(y, Math.max(8, maxY)))
  widget.style.left = nx + 'px'
  widget.style.top  = ny + 'px'
  widget.style.right = widget.style.bottom = 'auto'
}

/* ── keyboard ─────────────────────────────────────────────────────────────
   Ignored while a text field has focus, so typing "3" into the clock does not
   jump variants.                                                            */
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return
  const t = e.target
  if (t.matches?.('input, textarea, select')) return
  if (e.key === 'Escape' && modalOpen) { modalOpen = false; render(); return }
  if (/^[1-7]$/.test(e.key)) { setVariant(+e.key); return }
  if (e.key === 't' && variant === 6) { showTest = !showTest; syncWidget(); render(); save(); return }
  if (e.key === '[' || e.key === ']') {
    const i = FRAMES.findIndex(f => f.id === frameId)
    const next = (i + (e.key === ']' ? 1 : -1) + FRAMES.length) % FRAMES.length
    frameId = FRAMES[next].id
    $('#w-frame').value = frameId
    applyFrame(); render(); save()
    return
  }
  if (e.key === 'd') { setTheme(isDark() ? 'light' : 'dark'); return }
  if (e.key === 'h') { hideWidget(!widget.classList.contains('hidden')) }
})

/* ═══════════════════════════════════════════════════════════════════════════
   PERSISTENCE
   ═════════════════════════════════════════════════════════════════════════ */
const KEY = 'sip-proto-layouts'
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      state, clockInput, activeSection, variant, sheetOpen, frameId,
      toastPosition, showTest, holdMs,
      widget: {
        left: widget.style.left, top: widget.style.top,
        collapsed: widget.classList.contains('collapsed'),
        hidden: widget.classList.contains('hidden'),
      },
    }))
  } catch {}
}
function load() {
  let d = null
  try { d = JSON.parse(localStorage.getItem(KEY) || 'null') } catch {}
  if (!d) return
  Object.assign(state, d.state || {})
  if (d.clockInput) clockInput = d.clockInput
  if (d.activeSection) activeSection = d.activeSection
  if (d.variant) variant = d.variant
  if (typeof d.sheetOpen === 'boolean') sheetOpen = d.sheetOpen
  if (typeof d.showTest === 'boolean') showTest = d.showTest
  if (HOLDS.includes(d.holdMs)) holdMs = d.holdMs
  if (d.toastPosition && POSITIONS.includes(d.toastPosition)) toastPosition = d.toastPosition
  if (d.frameId && FRAMES.some(f => f.id === d.frameId)) frameId = d.frameId
  const w = d.widget || {}
  if (w.left && w.top) { widget.style.left = w.left; widget.style.top = w.top; widget.style.right = widget.style.bottom = 'auto' }
  widget.classList.toggle('collapsed', !!w.collapsed)
  hideWidget(!!w.hidden)
}

/* ═══════════════════════════════════════════════════════════════════════════
   BOOT
   ═════════════════════════════════════════════════════════════════════════ */
load()
applyTheme()
$('#w-frame').value = frameId
syncWidget()

// Default position: bottom-left, out of the way of every variant's content.
// On a phone-sized window the expanded panel would cover most of the layout
// under test, so it starts collapsed there — one click to open, still draggable.
if (!widget.style.left) {
  if (window.innerWidth < 620) widget.classList.add('collapsed')
  widget.style.left = '16px'
  widget.style.top  = (window.innerHeight - widget.offsetHeight - 16) + 'px'
}

applyFrame()
render()

// Variant 5 re-renders when the container crosses its own roomy/compact line;
// every variant re-measures fit on any resize.
let lastRoomy = v5Roomy()
new ResizeObserver(() => {
  const roomy = v5Roomy()
  if (variant === 5 && roomy !== lastRoomy) { lastRoomy = roomy; render() }
  else { syncScrollHint(); measureFit() }
}).observe(stage)

window.addEventListener('resize', () => {
  applyFrame()
  // Re-clamp so shrinking the window can never strand the widget off-screen.
  if (widget.classList.contains('hidden')) return
  const r = widget.getBoundingClientRect()
  placeWidget(r.left, r.top)
})
</script>
</body>
</html>
