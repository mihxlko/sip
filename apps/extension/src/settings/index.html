<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIP — Settings</title>
    <!-- Preload the three faces tokens.css declares. These resolve against the
         extension root, so they come off local disk — the point is ordering, not
         bandwidth: it starts the fetch at head-parse instead of after the CSS is
         parsed, which is what lets font-display:optional win its block window and
         render the real face with no swap. -->
    <link rel="preload" href="/fonts/SF-Pro-Rounded-Regular.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/SF-Pro-Rounded-Medium.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/SF-Pro-Rounded-Semibold.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
